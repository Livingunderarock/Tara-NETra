<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- Precision astronomical instrument / yantra mark -->
  <!-- Outer calibration ring -->
  <circle cx="32" cy="32" r="29" fill="none" stroke="#B08A3C" stroke-width="1" stroke-dasharray="1 3"/>
  <circle cx="32" cy="32" r="26" fill="none" stroke="#20263A" stroke-width="1.2"/>
  <circle cx="32" cy="32" r="21" fill="none" stroke="#B08A3C" stroke-width="0.8"/>
  
  <!-- Cardinal alignment ticks -->
  <line x1="32" y1="3" x2="32" y2="9" stroke="#A66A2C" stroke-width="1.5"/>
  <line x1="32" y1="55" x2="32" y2="61" stroke="#A66A2C" stroke-width="1.5"/>
  <line x1="3" y1="32" x2="9" y2="32" stroke="#A66A2C" stroke-width="1.5"/>
  <line x1="55" y1="32" x2="61" y2="32" stroke="#A66A2C" stroke-width="1.5"/>
  
  <!-- Diagonal subtle ticks -->
  <line x1="13" y1="13" x2="16" y2="16" stroke="#B08A3C" stroke-width="0.8"/>
  <line x1="51" y1="13" x2="48" y2="16" stroke="#B08A3C" stroke-width="0.8"/>
  <line x1="13" y1="51" x2="16" y2="48" stroke="#B08A3C" stroke-width="0.8"/>
  <line x1="51" y1="51" x2="48" y2="48" stroke="#B08A3C" stroke-width="0.8"/>

  <!-- Precision Eye (Netra) arcs -->
  <path d="M 17 32 C 22 23, 42 23, 47 32 C 42 41, 22 41, 17 32 Z" fill="none" stroke="#20263A" stroke-width="1.4"/>
  <circle cx="32" cy="32" r="6.5" fill="none" stroke="#B08A3C" stroke-width="1.2"/>
  
  <!-- Central Bindu / Star (Tārā) -->
  <circle cx="32" cy="32" r="2.5" fill="#A66A2C"/>
